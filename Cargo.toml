[package]
name = "doorman"
version = "0.1.0"
edition = "2024"

[dependencies]
ahash = "0.8"
axum = { version = "0.8.9", optional = true }
forwarded-header-value = "0.1.1"
governor = { version = "0.10.4", features = ["dashmap"] }
http = "1"
ipnet = "2.11.0"
tower = { version = "0.5.3", features = ["util"] }
tokio = { version = "1.48.0", features = ["macros", "rt", "time"] }

[features]
default = []
axum = ["dep:axum"]
